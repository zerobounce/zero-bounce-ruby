# Run RSpec tests (VCR cassettes; no live API key needed for recorded specs).
name: SDK CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor: keep in step with required_ruby_version in
          # zerobounce.gemspec. Gemfile.lock holds gems that need a newer Ruby,
          # so this entry installs the same Gemfile from its own lockfile.
          - ruby: "3.0"
            gemfile: gemfiles/ruby_3.0.gemfile
          - ruby: "3.4"
            gemfile: Gemfile
          # Newest stable Ruby. benchmark left the default gems in 4.0 and is a
          # gemspec development dependency for RuboCop's load chain.
          - ruby: "4.0"
            gemfile: Gemfile
    env:
      ZEROBOUNCE_API_KEY: "invalid_key_for_tests"
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      - name: Run specs
        run: bundle exec rspec

      # The gem as users install it: built from the gemspec, installed into an
      # empty GEM_HOME and loaded from outside the checkout, so lib/ is not on
      # the load path and a file left out of spec.files fails here.
      - name: Build, install and load the gem
        run: |
          gem_file="$RUNNER_TEMP/zerobounce-sdk.gem"
          gem build zerobounce.gemspec --output "$gem_file"
          ruby -rrubygems/package -e 'missing = Dir["lib/**/*.rb"] - Gem::Package.new(ARGV[0]).spec.files
                   abort "Not in the gem: #{missing.join(", ")}" unless missing.empty?' "$gem_file"
          export GEM_HOME="$RUNNER_TEMP/gem-home" GEM_PATH="$RUNNER_TEMP/gem-home"
          gem install --no-document rest-client -v '~> 2.1'
          gem install --local --no-document "$gem_file"
          cd "$RUNNER_TEMP"
          ruby -e '
            require "zerobounce"
            home = ENV.fetch("GEM_HOME")
            stray = $LOADED_FEATURES.grep(%r{/zerobounce[/.]}).reject { |f| f.start_with?(home) }
            abort "Loaded from outside the installed gem: #{stray.join(", ")}" unless stray.empty?
            Zerobounce.configure { |c| c.apikey = "not-a-real-key" }
            Zerobounce::Warmup.new("not-a-real-key").inspect
            puts "zerobounce-sdk #{Zerobounce::VERSION} loads from #{Gem.loaded_specs.fetch("zerobounce-sdk").full_gem_path}"
          '
